name: Update tournament results

on:
  schedule:
    # Matches finish ~21:00–04:00 UTC. Poll every 30 min in that window.
    - cron: "*/30 20-23 * * *"
    - cron: "*/30 0-4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch finished results
        id: fetch
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          node scripts/update-results.mjs | tee out.log
          echo "changed=$(grep -c '^CHANGED$' out.log || true)" >> "$GITHUB_OUTPUT"
      - name: Validate engine still runs on new data
        if: steps.fetch.outputs.changed == '1'
        run: node test.mjs
      - name: Commit and push
        if: steps.fetch.outputs.changed == '1'
        run: |
          git config user.name "goalcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data.json
          git commit -m "chore: record finished match results [skip ci]"
          git push
